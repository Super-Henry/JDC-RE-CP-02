name: Build OpenWrt - Henry Custom

permissions:
  contents: write
  actions: write

on:
  #push:
    #branches:
      #- openwrt-24.10
  workflow_dispatch:

env:
  REMOTE_REPOSITORY: Super-Henry/openwrt
  REMOTE_BRANCH: openwrt-24.10
  CONFIG_FILE: jdcloud_luban.config
  CUSTOM_FILES_PATH: files/
  RELEASE_PREFIX: openwrt-24.10
  ENV: openwrt-24.10

jobs:
  check_commits:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      new_commits: ${{ steps.check_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for new commits in both repositories
        id: check_commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/${{ env.REMOTE_REPOSITORY }}/branches/${{ env.REMOTE_BRANCH }}" --jq .commit.sha)
          release_body=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .body 2>/dev/null || echo "")

          new_commits=$([[ "$release_body" == *"$latest_sha"* ]] && echo "false" || echo "true")

          echo "new_commits=$new_commits" >> "$GITHUB_OUTPUT"
          echo "latest_commit_sha=$latest_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build OpenWrt
    needs: check_commits
    if: github.event_name == 'workflow_dispatch' || needs.check_commits.outputs.new_commits == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget
      - name: Checkout remote repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_BRANCH }}
          fetch-tags: true

      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: "builder_repo"

      - name: Add custom patches
        run: |
          df -hT
          if [ -d "builder_repo/patches" ] && [ "$(ls -A builder_repo/patches 2>/dev/null)" ]; then
            for patch in builder_repo/patches/*.patch; do
              echo "Applying patch $patch ..."
              ls -al "$patch" && sha256sum "$patch"
              [ -f "$patch" ] && git apply --verbose "$patch"
            done
          fi

      - name: Update and install feeds
        run: |
          df -h

          #echo 'src-git custom https://github.com/kiddin9/kwrt-packages' >> feeds.conf.default
          # 注释passwall2
          #git clone https://github.com/Super-Henry/Openwrt-Passwall2.git package/feeds/luci/luci-app-passwall2
          #git clone -b openwrt-24.10 https://github.com/Super-Henry/Openwrt-Passwall-Packages.git package/utils/passwall2
          git clone https://github.com/jerrykuku/luci-theme-argon.git package/feeds/luci/luci-theme-argon
          git clone https://github.com/jerrykuku/luci-app-argon-config.git package/feeds/luci/luci-app-argon-config
          git clone https://github.com/Super-Henry/OpenClash.git package/luci-app-openclash
          #git clone https://github.com/dgyangxf/luci-app-vlmcsd.git package/feeds/luci/luci-app-vlmcsd
          #git clone https://github.com/im-0/openwrt-package.vlmcsd.git package/utils/vlmcsd
          #git clone https://github.com/sbwml/openwrt-qBittorrent package/feeds/qBittorrent
          unzip builder_repo/luci-app-accesscontrol.zip -d package/feeds/luci/applications
          # fix the passwall2 Makefile
          #sed -i -e '/^endchoice/i\\n\tconfig PACKAGE_$(PKG_NAME)_Basic_Core_None\n\t\tbool "None"' package/feeds/luci/luci-app-passwall2/luci-app-passwall2/Makefile
          ./scripts/feeds update -a && ./scripts/feeds install -a -p luci && ./scripts/feeds install -a -p packages

      - name: Setup configuration and custom files
        run: |
          df -h
          mv builder_repo/${{ env.CONFIG_FILE }} .config
          
          # 修复ssh冲突：禁用原版openssh-server，只启用PAM版本
          sed -i 's/^CONFIG_PACKAGE_openssh-server=y/# CONFIG_PACKAGE_openssh-server is not set/' .config
          echo "CONFIG_PACKAGE_openssh-server-pam=y" >> .config
          
          # ==============================================
          # 已改回 软浮点 完美适配官方架构
          # ==============================================
          echo "CONFIG_SOFT_FLOAT=y" >> .config
          echo "CONFIG_HARD_FLOAT=n" >> .config
          echo "CONFIG_MIPS_FPU_EMULATOR=n" >> .config

          # ==============================================
          # 全局修复 pre-install 脚本报错 / ubus/service缺失
          # ==============================================
          echo "CONFIG_PACKAGE_procd=y" >> .config
          echo "CONFIG_PACKAGE_ubus=y" >> .config
          echo "CONFIG_PACKAGE_ubusd=y" >> .config
          echo "CONFIG_PACKAGE_service=y" >> .config
          echo "CONFIG_PACKAGE_openwrt-release=y" >> .config
          echo "CONFIG_TARGET_PERMISSION_SET=y" >> .config
          echo "CONFIG_PACKAGE_blockd=y" >> .config
          echo "CONFIG_PACKAGE_lsblk=y" >> .config
          echo "CONFIG_PACKAGE_dmidecode=y" >> .config
          # 然后添加其他插件配置（保留原有全部 echo 命令）
          echo "CONFIG_USE_APK=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config

          # 插件全部 =m 不占用固件空间
          echo "CONFIG_PACKAGE_luci-app-openclash=m" >> .config
          #echo "CONFIG_PACKAGE_luci-app-passwall2=m" >> .config

          echo "CONFIG_PACKAGE_luci-compat=y" >> .config
          echo "CONFIG_PACKAGE_luci-base=y" >> .config

          echo "" >> .config
          echo "# OpenClash 依赖（OpenSSL 3.0）" >> .config
          echo "CONFIG_PACKAGE_openssl=y" >> .config
          echo "CONFIG_PACKAGE_coreutils=m" >> .config
          echo "CONFIG_PACKAGE_coreutils-nohup=m" >> .config
          echo "CONFIG_PACKAGE_bash=m" >> .config
          echo "CONFIG_PACKAGE_jsonfilter=m" >> .config
          echo "CONFIG_PACKAGE_ca-certificates=m" >> .config

          echo "" >> .config
          echo "# PassWall2 依赖（使用 OpenSSL 3.0）" >> .config
          #echo "CONFIG_PACKAGE_passwall2=m" >> .config
          echo "CONFIG_PACKAGE_xray-core=m" >> .config
          echo "CONFIG_PACKAGE_xray-plugin=m" >> .config
          echo "CONFIG_PACKAGE_sing-box=m" >> .config
          echo "CONFIG_PACKAGE_hysteria=m" >> .config
          
          # 🔥 🔥 🔥 这里关闭 naiveproxy 解决 404 错误 🔥 🔥 🔥
          echo "CONFIG_PACKAGE_naiveproxy=n" >> .config
          #echo "CONFIG_PACKAGE_passwall2_naiveproxy=n" >> .config
          
          echo "CONFIG_PACKAGE_tuic-client=m" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-libev-ss-redir=m" >> .config
          echo "CONFIG_PACKAGE_shadowsocks-libev-ss-tunnel=m" >> .config
          echo "CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=m" >> .config

          echo "" >> .config
          echo "# 必须集成内核模块" >> .config
          echo "CONFIG_PACKAGE_kmod-tun=y" >> .config
          echo "CONFIG_PACKAGE_kmod-inet-diag=y" >> .config
          echo "CONFIG_PACKAGE_kmod-nf-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ipt-tproxy=y" >> .config

          echo "" >> .config
          echo "# 必要工具" >> .config
          echo "CONFIG_PACKAGE_iptables=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
          echo "CONFIG_PACKAGE_unzip=y" >> .config
          echo "CONFIG_PACKAGE_ca-bundle=y" >> .config

          echo "" >> .config
          echo "# 辅助组件" >> .config
          echo "CONFIG_PACKAGE_ipset=m" >> .config
          echo "CONFIG_PACKAGE_libcap=m" >> .config
          echo "CONFIG_PACKAGE_libstdcpp=y" >> .config

          echo "" >> .config
          echo "# DNS 配置" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq=n" >> .config

          echo "" >> .config
          echo "# WEB挂载点" >> .config
          echo "CONFIG_PACKAGE_luci-mod-system=y" >> .config
          echo "CONFIG_PACKAGE_luci-mod-system-mountpoints=y" >> .config
          echo "CONFIG_PACKAGE_block-mount=y" >> .config

          make defconfig -j$(nproc)
          mkdir -p ${{ env.CUSTOM_FILES_PATH }}
          [ -d "builder_repo/${{ env.CUSTOM_FILES_PATH }}" ] && mv builder_repo/${{ env.CUSTOM_FILES_PATH }}* ${{ env.CUSTOM_FILES_PATH }} || true

      # ========== ✅ 自动注入真实编译时间（你要的核心功能） ==========
      - name: Inject real build timestamp
        run: |
          BUILD_DATE=$(date +%s)
          BUILD_DATE_FRIENDLY=$(date +"%Y-%m-%d %H:%M:%S")
          echo "BUILD_DATE=\"$BUILD_DATE\"" >> package/base-files/files/etc/os-release
          mkdir -p files/etc
          echo "固件编译时间: $BUILD_DATE_FRIENDLY" > files/etc/build_time
          echo "编译源码提交: ${{ needs.check_commits.outputs.latest_commit_sha }}" >> files/etc/build_time

      - name: Use /mnt for more disk space
        run: |
          sudo mkdir -p /mnt/upper /mnt/work && sudo chmod a+w /mnt/upper
          sudo mount -t overlay -olowerdir=$(pwd),upperdir=/mnt/upper,workdir=/mnt/work overlay $(pwd)
          df -h
                 
      - name: cache
        uses: actions/cache@v4
        if: always()
        with:
          key: openwrt-build-${{ needs.check_commits.outputs.latest_commit_sha }}
          restore-keys: |
            openwrt-build
          path: |
            build_dir
            dl
            staging_dir
            tmp

      - name: Clean up old caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/caches --paginate --jq '.actions_caches[0:] | .[] |.key' | while read key; do
            echo "Removing old cache $key ..."
            gh api -X DELETE "/repos/${{ github.repository }}/actions/caches?key=$key" 2>/dev/null || true
          done

      - name: Download source
        run: |
          df -h
          ./scripts/feeds update -a
          make download -j$(nproc)
          
      - name: Build firmware
        run: |
          df -h
          make check -j$(nproc) FIXUP=1 V=s
          make -j$(nproc) || make -j1 V=s  # Retry single-threaded on failure
          tar cvzf bin/targets/ramips/mt7621/snapshots.tar.gz -C bin packages/mipsel_24kc targets/ramips/mt7621/packages

      - name: Verify packages in firmware
        run: |
          echo "=== 验证包是否被编译 ==="
          echo "检查 OpenClash 相关包..."
          find bin/ -name "*.ipk" | grep -E "(openclash)" || echo "⚠️ 未找到 OpenClash 包"
          echo ""
          echo "检查 Argon 主题相关包..."
          find bin/ -name "*.ipk" | grep -E "(argon)" || echo "⚠️ 未找到 Argon 主题包"
          echo "=== 验证完成 ==="

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt7621-images
          path: bin/targets/ramips/mt7621

      - name: Check disk space usage
        if: always()
        run: df -h
        
  release:
    name: Create release
    needs: [check_commits, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mt7621-images
          path: firmware
      - name: Set release date with timestamp
        run: |
          echo "RELEASE_DATE=$(date +%F)" >> $GITHUB_ENV
          echo "RELEASE_TIME=$(date +%H-%M-%S)" >> $GITHUB_ENV
      - name: Publish release
        uses: softprops/action-gh-release@master
        with:
          files: firmware/*
          tag_name: ${{ env.RELEASE_PREFIX }}-${{ env.RELEASE_DATE }}-${{ env.RELEASE_TIME }}
          name: 🚀 OpenWrt Build Release ${{ env.RELEASE_DATE }} ${{ env.RELEASE_TIME }}
          body: |
            ## 📦 OpenWrt Automated Build Release

            **Build Date:** ${{ env.RELEASE_DATE }} ${{ env.RELEASE_TIME }}

            ### 🔄 Main Repository
            **Repository:** [${{ env.REMOTE_REPOSITORY }}](https://github.com/${{ env.REMOTE_REPOSITORY }})
            **Branch:** `${{ env.REMOTE_BRANCH }}`
            **Commit:** `${{ needs.check_commits.outputs.latest_commit_sha }}`

            ### 📝 Build Information
            - **Target:** [JDCloud RE-CP-02 鲁班]
            - **浮点模式:** 软浮点 (Soft Float) ✅
            - **固件大小:** 小于 16MB
            - **OpenSSL 配置:** 全局 OpenSSL 3.0
            - **Configuration:** [`${{ env.CONFIG_FILE }}`](${{ env.CONFIG_FILE }})

            ### 📦 插件说明（均为离线IPK，不占固件空间）
            - OpenClash 全套 (OpenSSL 3.0)
            - Argon 主题 + 配置

            ### 📋 Notes
            - Automated build triggered by ${{ github.event_name }}
            - Previous releases are automatically cleaned up (keeping latest 5)
            ---
            _Generated by GitHub Actions 🤖_
            # 👇👇👇 已修复：强制绑定 openwrt-24.10 分支
            target_commitish: openwrt-24.10

      - name: Clean up old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases --paginate --jq '.[5:] | .[] | "\(.id) \(.tag_name)"' | while read id tag; do
            day=$(echo "$tag" |cut -d'-' -f4)
            if [ $day -ne "01" ] && [ $day -ne "08" ] && [ $day -ne "15" ] && [ $day -ne "23" ]; then
              echo "Removing old release $tag ..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null || true
            fi
          done
